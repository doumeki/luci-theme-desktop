name: Bug report
description: Report a bug in luci-theme-desktop
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Paste the **diagnostics output** below — it already contains the
        firmware, LuCI runtime, theme version and save-log tail, so no need
        to fill in environment fields by hand.

        **How to get it:**
        1. Right-click the desktop → **Theme** → **Diagnostics** — the full
           environment info is copied to your clipboard automatically
        2. Paste it in the box below

        If the theme UI itself is broken, read the log over SSH instead:
        `cat /var/log/desktop-save.log`  (save/audit log — failures include
        the firmware/runtime/version context)

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: Paste the copied diagnostics here
      placeholder: |
        DISTRIB_ID=...
        DISTRIB_RELEASE=...
        arch: ...
        luci_runtime: ...
        theme_version: ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happens vs. what you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
